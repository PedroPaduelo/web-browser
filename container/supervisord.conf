[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:chrome]
command=google-chrome
    --no-sandbox
    --disable-gpu
    --disable-dev-shm-usage
    --no-first-run
    --no-default-browser-check
    --disable-translate
    --disable-background-networking
    --window-size=%(ENV_RESOLUTION)s
    --window-position=0,0
    --user-data-dir=/data/chrome-profile
    --load-extension=/data/extension
    --use-fake-device-for-media-stream
    --use-fake-ui-for-media-stream
    --autoplay-policy=no-user-gesture-required
    --enable-features=WebRTCPipeWireCapturer
    --start-maximized
    --display=:%(ENV_DISPLAY_NUM)s
    %(ENV_START_URL)s
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome-err.log

[program:gstreamer-video]
command=gst-launch-1.0 -v
    ximagesrc display-name=:%(ENV_DISPLAY_NUM)s use-damage=false show-pointer=true
    ! video/x-raw,framerate=30/1
    ! videoconvert
    ! vp8enc deadline=1 target-bitrate=%(ENV_VIDEO_BITRATE)s cpu-used=4 threads=2 keyframe-max-dist=60
    ! rtpvp8pay pt=96 ssrc=1111
    ! udpsink host=127.0.0.1 port=%(ENV_VIDEO_RTP_PORT)s
priority=40
autorestart=true
stdout_logfile=/var/log/supervisor/gstreamer-video.log
stderr_logfile=/var/log/supervisor/gstreamer-video-err.log

[program:gstreamer-audio-out]
command=gst-launch-1.0 -v
    pulsesrc device=virtual_speaker.monitor
    ! audioconvert
    ! audioresample
    ! opusenc bitrate=%(ENV_AUDIO_BITRATE)s
    ! rtpopuspay pt=101 ssrc=2222
    ! udpsink host=127.0.0.1 port=%(ENV_AUDIO_RTP_PORT)s
priority=41
autorestart=true
stdout_logfile=/var/log/supervisor/gstreamer-audio-out.log
stderr_logfile=/var/log/supervisor/gstreamer-audio-out-err.log

[program:gstreamer-audio-in]
command=gst-launch-1.0 -v
    udpsrc port=%(ENV_MIC_RTP_PORT)s caps="application/x-rtp,media=audio,encoding-name=OPUS,payload=101"
    ! rtpopusdepay
    ! opusdec
    ! audioconvert
    ! audioresample
    ! pulsesink device=virtual_mic
priority=42
autorestart=true
stdout_logfile=/var/log/supervisor/gstreamer-audio-in.log
stderr_logfile=/var/log/supervisor/gstreamer-audio-in-err.log

[program:session-agent]
command=node /app/session-agent/index.js
directory=/app/session-agent
priority=50
autorestart=true
environment=DISPLAY_NUM="%(ENV_DISPLAY_NUM)s",RESOLUTION="%(ENV_RESOLUTION)s",VIDEO_RTP_PORT="%(ENV_VIDEO_RTP_PORT)s",AUDIO_RTP_PORT="%(ENV_AUDIO_RTP_PORT)s",MIC_RTP_PORT="%(ENV_MIC_RTP_PORT)s",AGENT_PORT="%(ENV_AGENT_PORT)s"
stdout_logfile=/var/log/supervisor/session-agent.log
stderr_logfile=/var/log/supervisor/session-agent-err.log
